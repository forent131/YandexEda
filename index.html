<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Цель">
<meta name="theme-color" content="#0A0A12">
<title>Цель месяца</title>
<style>
:root{--bg:#0A0A12;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);
--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);
--tx:#FFF;--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.32);
--violet:#A855F7;--cyan:#22D3EE;--green:#10E080;--amber:#FBBF24;--rose:#FF3D71;--blue:#5B6BFF;
--gc:linear-gradient(135deg,#22D3EE,#A855F7);--gg:linear-gradient(135deg,#10E080,#22D3EE);
--ga:linear-gradient(135deg,#FBBF24,#FF3D71);
--sh:0 20px 60px rgba(0,0,0,.5);--gl:0 8px 32px rgba(34,211,238,.4);
--r:20px;--rl:28px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Helvetica Neue',sans-serif;
background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4;overflow-x:hidden;
overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:-50%;z-index:-1;pointer-events:none;
background:radial-gradient(circle at 20% 15%,rgba(34,211,238,.25),transparent 45%),
radial-gradient(circle at 80% 20%,rgba(168,85,247,.25),transparent 45%),
radial-gradient(circle at 50% 95%,rgba(16,224,128,.15),transparent 45%);
filter:blur(40px);animation:bgS 25s ease-in-out infinite}
@keyframes bgS{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3%,-2%) scale(1.06)}66%{transform:translate(-2%,3%) scale(1.03)}}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
input,button{outline:none;font-family:inherit}

/* NAV */
.nav{position:sticky;top:0;z-index:50;padding:env(safe-area-inset-top) 18px 14px;
background:linear-gradient(180deg,rgba(10,10,18,.96),rgba(10,10,18,.5) 75%,transparent);
-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.nav-row{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.nav-title{font-size:30px;font-weight:800;letter-spacing:-.8px;padding:6px 0 0;
background:linear-gradient(135deg,#fff,rgba(255,255,255,.75));-webkit-background-clip:text;
background-clip:text;-webkit-text-fill-color:transparent}
.nav-act{color:var(--tx);font-size:20px;background:var(--glass);border:1px solid var(--bd);
width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.nav-act:active{transform:scale(.92);background:var(--glass2)}

.page{padding:8px 18px 24px}
.section{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;
letter-spacing:.12em;padding:22px 4px 10px}
.group{background:var(--glass);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.row{display:flex;align-items:center;padding:14px 18px;min-height:48px;position:relative}
.row+.row::before{content:'';position:absolute;top:0;left:18px;right:0;height:1px;background:var(--bd)}
.row .k{flex:1;font-size:15px;color:var(--tx2)}
.row .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.row .v.g{color:var(--green)}.row .v.r{color:var(--rose)}.row .v.o{color:var(--amber)}
.row .v.b{color:#8B9AFF}.row .v.c{color:var(--cyan)}

/* HERO */
.hero{position:relative;border-radius:var(--rl);padding:28px 24px;overflow:hidden;
background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
border:1px solid var(--bd2);backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--sh)}
.hero::before{content:'';position:absolute;top:-50%;right:-30%;width:240px;height:240px;
background:radial-gradient(circle,rgba(34,211,238,.45),transparent 65%);
border-radius:50%;filter:blur(20px);animation:pulse 4s ease-in-out infinite}
.hero.done::before{background:radial-gradient(circle,rgba(16,224,128,.5),transparent 65%)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.8}}
.hero .lbl{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;
letter-spacing:.12em;position:relative;z-index:1}
.hero .big{font-size:48px;font-weight:800;letter-spacing:-2px;margin-top:10px;line-height:1;
position:relative;z-index:1;font-variant-numeric:tabular-nums;
background:linear-gradient(135deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;
background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{font-size:14px;color:var(--tx2);margin-top:10px;position:relative;z-index:1}

/* PROGRESS */
.prog-wrap{margin-top:20px;position:relative;z-index:1}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-top .lbl{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.1em}
.prog-top .pct{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{height:14px;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:8px;
overflow:hidden;position:relative}
.prog .fill{height:100%;border-radius:7px;transition:width 1s cubic-bezier(.2,.8,.2,1);
background:var(--gc);box-shadow:0 0 24px rgba(34,211,238,.5);position:relative}
.prog .fill::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;
background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);
border-radius:7px 7px 0 0}
.prog .fill.done{background:var(--gg);box-shadow:0 0 24px rgba(16,224,128,.5)}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--glass);border-radius:var(--r);padding:16px;border:1px solid var(--bd);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.stat .l{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:10px;color:var(--tx3);margin-top:3px}
.stat .v.g{color:var(--green)}.stat .v.c{color:var(--cyan)}.stat .v.a{color:var(--amber)}
.stat .v.v{color:var(--violet)}.stat .v.r{color:var(--rose)}

/* FIELDS */
.field{padding:14px 18px;min-height:48px;display:flex;align-items:center;position:relative}
.field+.field::before{content:'';position:absolute;top:0;left:18px;right:0;height:1px;background:var(--bd)}
.field label{font-size:15px;color:var(--tx2);flex:1}
.field input{flex:1;background:transparent;border:none;color:var(--tx);font-size:17px;
font-weight:600;text-align:right;padding:0;margin-left:12px;min-width:0;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--tx3);font-weight:400}
.field input[type=number]::-webkit-outer-spin-button,
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input[type=number]{-moz-appearance:textfield}

/* BUTTONS */
.btn{display:block;width:100%;padding:18px;border-radius:18px;font-size:16px;font-weight:700;
border:none;cursor:pointer;letter-spacing:-.2px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.9}
.btn-p{background:var(--gc);color:#fff;box-shadow:var(--gl)}
.btn-d{background:rgba(255,61,113,.15);color:var(--rose);border:1px solid rgba(255,61,113,.3)}
.btn+.btn{margin-top:10px}

/* ENTRIES */
.entry{display:flex;align-items:center;padding:14px 18px;position:relative}
.entry+.entry::before{content:'';position:absolute;top:0;left:74px;right:0;height:1px;background:var(--bd)}
.badge{width:44px;height:44px;border-radius:12px;background:var(--glass2);border:1px solid var(--bd);
display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px}
.badge .d{font-size:17px;font-weight:800;line-height:1;letter-spacing:-.5px}
.badge .m{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.entry .info{flex:1;min-width:0}
.entry .earn{font-size:17px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.entry .meta{font-size:12px;color:var(--tx3);margin-top:4px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:transparent;border:none;
display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
color:var(--tx3);padding:0;margin-left:4px;transition:.15s}
.icon-btn:active{background:var(--glass2);color:var(--tx)}

.empty{padding:56px 24px;text-align:center}
.empty .i{font-size:48px;opacity:.35;margin-bottom:14px}
.empty .t{font-size:14px;color:var(--tx2);line-height:1.5}

/* FAB */
.fab{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));right:20px;z-index:60;
width:58px;height:58px;border-radius:50%;background:var(--gc);color:#fff;border:none;
font-size:30px;font-weight:300;box-shadow:var(--gl);display:flex;align-items:center;
justify-content:center;transition:transform .15s;cursor:pointer}
.fab:active{transform:scale(.9)}

/* SHEET */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;opacity:0;
pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;
background:linear-gradient(180deg,#15151F,#0A0A12);border-radius:28px 28px 0 0;
padding:10px 18px calc(24px + env(safe-area-inset-bottom));
transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
border-top:1px solid var(--bd2);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.on{transform:none}
.sheet-handle{width:40px;height:5px;background:var(--tx3);border-radius:3px;margin:0 auto 16px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:20px;
display:flex;justify-content:space-between;align-items:center}
.sheet h3 .cancel{color:var(--blue);font-size:15px;font-weight:500;background:none;
border:none;cursor:pointer;padding:0}

/* Confetti */
@keyframes cf{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}
100%{transform:translateY(-300px) rotate(720deg) scale(.5);opacity:0}}
.cf{position:fixed;pointer-events:none;font-size:26px;z-index:500;animation:cf 1.6s ease-out forwards}

.toast{position:fixed;bottom:calc(40px + env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%) translateY(20px);background:rgba(20,20,30,.95);
border:1px solid var(--bd2);color:#fff;padding:12px 20px;border-radius:14px;
font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:900;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);pointer-events:none;
box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.g{border-color:rgba(16,224,128,.4)}
.toast.r{border-color:rgba(255,61,113,.4)}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-row">
    <div class="nav-title">Цель</div>
    <button class="nav-act" onclick="openGoalSheet()">⚙️</button>
  </div>
</div>

<div class="page">
  <div class="hero" id="hero">
    <div class="lbl">Прогресс месяца</div>
    <div class="big" id="earned">0 ₽</div>
    <div class="sub" id="heroSub">из 100 000 ₽</div>
    <div class="prog-wrap">
      <div class="prog-top">
        <span class="lbl">Выполнено</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="prog"><div class="fill" id="bar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="l">Осталось</div><div class="v r" id="left">100 000 ₽</div></div>
    <div class="stat"><div class="l">Дней до конца</div><div class="v c" id="daysLeft">30</div><div class="s" id="dateTo">—</div></div>
    <div class="stat"><div class="l">Нужно в день</div><div class="v a" id="perDay">3 300 ₽</div><div class="s">чтобы успеть</div></div>
    <div class="stat"><div class="l">Средний факт</div><div class="v v" id="avgDay">0 ₽</div><div class="s">за день</div></div>
  </div>

  <div class="section">Прогноз</div>
  <div class="group">
    <div class="row"><span class="k">Выйдешь на</span><span class="v g" id="forecast">—</span></div>
    <div class="row"><span class="k">Идёшь</span><span class="v b" id="pace">—</span></div>
    <div class="row"><span class="k">Лучший день</span><span class="v c" id="bestDay">—</span></div>
    <div class="row"><span class="k">Рабочих дней</span><span class="v" id="workedDays">0</span></div>
  </div>

  <div class="section">Дневник</div>
  <div class="group" id="list">
    <div class="empty"><div class="i">📊</div><div class="t">Нет записей.<br>Нажми ＋ чтобы добавить день.</div></div>
  </div>
</div>

<button class="fab" onclick="openDaySheet()">＋</button>

<div class="sheet-bg" id="sb" onclick="closeSheets()"></div>

<div class="sheet" id="shGoal">
  <div class="sheet-handle"></div>
  <h3>Цель месяца <button class="cancel" onclick="closeSheets()">Отмена</button></h3>
  <div class="group">
    <div class="field"><label>Сумма цели ₽</label><input type="number" inputmode="numeric" id="gAmount" placeholder="100000"></div>
    <div class="field"><label>Месяц</label><input type="month" id="gMonth"></div>
  </div>
  <button class="btn btn-p" onclick="saveGoal()" style="margin-top:22px">Сохранить</button>
</div>

<div class="sheet" id="shDay">
  <div class="sheet-handle"></div>
  <h3 id="dayTitle">День <button class="cancel" onclick="closeSheets()">Отмена</button></h3>
  <div class="group">
    <div class="field"><label>Дата</label><input type="date" id="dDate"></div>
    <div class="field"><label>Заработано ₽</label><input type="number" inputmode="numeric" id="dAmount" placeholder="0"></div>
    <div class="field"><label>Заметка</label><input type="text" id="dNote" placeholder="например, дождь, жирный вечер"></div>
  </div>
  <input type="hidden" id="dId">
  <button class="btn btn-p" onclick="saveDay()" style="margin-top:22px">Сохранить</button>
  <button class="btn btn-d" onclick="delDay()" id="dDel" style="display:none;margin-top:10px">Удалить</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ STORAGE ============ */
const GOAL='goal_v1',DAYS='goal_days_v1';
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const getGoal=()=>{try{return JSON.parse(localStorage.getItem(GOAL))||{amount:100000,month:curMonth()}}catch(e){return{amount:100000,month:curMonth()}}};
const setGoal=g=>localStorage.setItem(GOAL,JSON.stringify(g));

/* ============ UTILS ============ */
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const pad=n=>String(n).padStart(2,'0');
function curMonth(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function daysInMonth(ym){const[a,b]=ym.split('-').map(Number);return new Date(a,b,0).getDate()}
function monthName(ym){const[a,b]=ym.split('-').map(Number);return['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][b-1]+' '+a}
const MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const vib=ms=>{if(navigator.vibrate)try{navigator.vibrate(ms||8)}catch(e){}};
function toast(msg,type){const el=document.getElementById('toast');
el.textContent=msg;el.className='toast on'+(type?' '+type:'');
clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200)}

/* ============ RENDER ============ */
function render(){
  const goal=getGoal();
  const all=load(DAYS).filter(x=>x.date.startsWith(goal.month));
  const earned=all.reduce((a,x)=>a+(x.amount||0),0);
  const pct=goal.amount>0?Math.min(100,earned/goal.amount*100):0;
  const left=Math.max(0,goal.amount-earned);
  
  document.getElementById('earned').textContent=fmt(earned);
  document.getElementById('heroSub').textContent='из '+fmt(goal.amount)+' · '+monthName(goal.month);
  document.getElementById('pct').textContent=Math.round(pct)+'%';
  const bar=document.getElementById('bar');
  bar.style.width=pct+'%';
  if(pct>=100)bar.classList.add('done');else bar.classList.remove('done');
  document.getElementById('hero').classList.toggle('done',pct>=100);
  document.getElementById('left').textContent=fmt(left);
  
  // Days left
  const now=new Date();
  const [gy,gm]=goal.month.split('-').map(Number);
  const last=new Date(gy,gm,0);
  const isCurrent=goal.month===curMonth();
  let daysLeft;
  if(isCurrent){daysLeft=Math.max(1,last.getDate()-now.getDate()+1)}
  else if(new Date(gy,gm-1,1)>now){daysLeft=last.getDate()}
  else {daysLeft=0}
  document.getElementById('daysLeft').textContent=daysLeft;
  document.getElementById('dateTo').textContent='до '+last.getDate()+' '+MN[gm-1];
  
  const perDay=daysLeft>0?left/daysLeft:0;
  document.getElementById('perDay').textContent=fmt(perDay);
  
  const avg=all.length?earned/all.length:0;
  document.getElementById('avgDay').textContent=fmt(avg);
  
  // Forecast
  const totalDaysInMonth=last.getDate();
  const forecast=avg*totalDaysInMonth;
  document.getElementById('forecast').textContent=avg>0?fmt(forecast):'—';
  
  // Pace
  if(pct>=100)document.getElementById('pace').textContent='✅ Цель закрыта';
  else if(avg>=goal.amount/totalDaysInMonth)document.getElementById('pace').textContent='опережаешь';
  else if(avg>0)document.getElementById('pace').textContent='отстаёшь';
  else document.getElementById('pace').textContent='—';
  
  // Best day
  const best=all.reduce((a,x)=>!a||(x.amount||0)>a.amount?x:a,null);
  document.getElementById('bestDay').textContent=best?fmt(best.amount):'—';
  document.getElementById('workedDays').textContent=all.length;
  
  // List
  const list=document.getElementById('list');
  list.innerHTML='';
  const sorted=all.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){
    list.innerHTML='<div class="empty"><div class="i">📊</div><div class="t">Нет записей.<br>Нажми ＋ чтобы добавить день.</div></div>';
  } else {
    sorted.forEach(d=>{
      const dt=new Date(d.date+'T00:00:00');
      const row=document.createElement('div');row.className='entry';
      row.innerHTML=`<div class="badge"><div class="d">${dt.getDate()}</div><div class="m">${MN[dt.getMonth()]}</div></div>
        <div class="info"><div class="earn">${fmt(d.amount||0)}</div>
        <div class="meta">${d.note||'Без заметки'}</div></div>
        <button class="icon-btn" onclick="openDaySheet('${d.id}')">✏️</button>`;
      list.appendChild(row);
    });
  }
  
  if(pct>=100&&earned>0&&!document._celebrated){
    document._celebrated=true;
    celebrate();
    setTimeout(()=>{document._celebrated=false},10000);
  }
}

function celebrate(){
  const em=['🎉','✨','🎊','⭐️','🔥','💎','🏆'];
  for(let i=0;i<24;i++){
    const el=document.createElement('div');el.className='cf';
    el.textContent=em[i%em.length];
    el.style.left=(Math.random()*100)+'%';
    el.style.bottom='50%';
    el.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2400);
  }
}

/* ============ SHEETS ============ */
function closeSheets(){
  document.getElementById('sb').classList.remove('on');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));
}
function openGoalSheet(){
  closeSheets();
  const g=getGoal();
  document.getElementById('sb').classList.add('on');
  document.getElementById('shGoal').classList.add('on');
  document.getElementById('gAmount').value=g.amount;
  document.getElementById('gMonth').value=g.month;
}
function saveGoal(){
  const amount=+document.getElementById('gAmount').value||0;
  const month=document.getElementById('gMonth').value||curMonth();
  if(amount<=0){alert('Введи сумму');return}
  setGoal({amount,month});vib(15);
  closeSheets();render();
  toast('Цель: '+fmt(amount),'g');
}
function openDaySheet(id){
  closeSheets();
  document.getElementById('sb').classList.add('on');
  document.getElementById('shDay').classList.add('on');
  if(!id){
    document.getElementById('dId').value='';
    document.getElementById('dayTitle').innerHTML='День <button class="cancel" onclick="closeSheets()">Отмена</button>';
    document.getElementById('dDate').value=todayISO();
    document.getElementById('dAmount').value='';
    document.getElementById('dNote').value='';
    document.getElementById('dDel').style.display='none';
  } else {
    const d=load(DAYS).find(x=>x.id===id);if(!d)return;
    document.getElementById('dId').value=d.id;
    document.getElementById('dayTitle').innerHTML='Редактировать <button class="cancel" onclick="closeSheets()">Отмена</button>';
    document.getElementById('dDate').value=d.date;
    document.getElementById('dAmount').value=d.amount||0;
    document.getElementById('dNote').value=d.note||'';
    document.getElementById('dDel').style.display='block';
  }
}
function saveDay(){
  const date=document.getElementById('dDate').value;
  const amount=+document.getElementById('dAmount').value||0;
  if(!date||!amount){alert('Заполни дату и сумму');return}
  const id=document.getElementById('dId').value||Date.now().toString();
  const entry={id,date,amount,note:document.getElementById('dNote').value||''};
  const all=load(DAYS);const i=all.findIndex(x=>x.id===id);
  if(i>=0)all[i]=entry;else all.push(entry);
  save(DAYS,all);vib(15);
  closeSheets();render();
}
function delDay(){
  const id=document.getElementById('dId').value;if(!id)return;
  if(!confirm('Удалить запись?'))return;
  save(DAYS,load(DAYS).filter(x=>x.id!==id));
  closeSheets();render();
}
